# Builds craftski.exe: a tag v* publishes it as a GitHub release, a manual run keeps it as an
# artifact. No tests run here: some read the author's own AppData.lua.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain rust-toolchain.toml names
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/craftski.exe --generate-notes

      - name: Keep the exe
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: craftski
          path: target/release/craftski.exe
