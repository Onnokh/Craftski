<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Crafting and vendor-flip profits for WoW Forever, ranked from TSM's public auction-house prices.">
<title>Craftski</title>
<script src="https://rybbit.missingmounts.com/api/script.js?siteId=794553bb776a" defer></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0b0806; color: #a69c8b; }
  #status { position: fixed; inset: 0; display: grid; place-content: center; gap: 8px; padding: 0 16px; font: 15px/1.5 system-ui, sans-serif; text-align: center; }
  #status small { opacity: 0.7; }
</style>
</head>
<body>
<div id="status"><span>Loading Craftski…</span><small>Not affiliated with Blizzard Entertainment or TradeSkillMaster.</small></div>
<noscript>Craftski needs JavaScript and WebGL.</noscript>
<script type="module">
  import init from "./app/craftski.js";
  document.addEventListener("runepresent", () => document.getElementById("status")?.remove(), { once: true });
  init().catch((error) => {
    document.querySelector("#status span").textContent = `Craftski could not start: ${error}`;
    console.error(error);
  });
</script>
</body>
</html>
