[package]
name = "craftski"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
csv = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The folder chooser that finds AppData.lua opens the system's folder dialog.
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["native-file-dialog"] }
ureq = "3"

# The browser build, web/build.mjs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["webgl"] }
wasm-bindgen = "0.2"
# Compiled only so the desktop loaders type-check; the browser build never calls them.
ureq = { version = "3", default-features = false }
wasm-bindgen-futures = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Headers", "Response", "Storage", "Window", "console"] }
# Rune keeps wgpu objects in statics; with the WebGL backend they are Send and Sync only with this.
wgpu = { version = "~30.0.1", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }

# Rune lays out and paints every frame; unoptimized it misses the frame budget while a page
# animates. Optimizing the dependencies keeps debug builds smooth and this crate debuggable.
[profile.dev.package."*"]
opt-level = 3
